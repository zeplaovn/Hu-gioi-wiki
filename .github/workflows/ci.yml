name: Wiki CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run lint
      - run: npm run build
      - name: Confirm public entry points
        run: |
          test -f dist/index.html
          test -f dist/roadmap.html
          test -f dist/404.html
